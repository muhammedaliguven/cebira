services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cebira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cebira}
    ports:
      - "5432:5432"
    volumes:
      - cebira_pg:/var/lib/postgresql

volumes:
  cebira_pg:
